name: Fetch JTWC + NHC storm data

on:
  # Triggered by cron-job.org via repository_dispatch
  repository_dispatch:
    types: [JTWC_update]

  # Optional: Keep workflow_dispatch for manual runs from GitHub UI
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if data unchanged'
        required: false
        default: 'false'
        type: boolean

  # Optional: Keep GitHub's built-in scheduler as a backup (or remove if you only want cron-job.org)
  # schedule:
  #   # Run every 3 hours (UTC)
  #   - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  fetch-storm-data:
    runs-on: ubuntu-latest
    name: Fetch JTWC + NHC storm data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch JTWC data  →  data/storms.json
        run: python scripts/fetch_jtwc.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Fetch NHC data   →  data/nhc_atlantic.json + data/nhc_pacific.json
        run: python scripts/fetch_nhc.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit and push data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet && [ "${{ github.event.inputs.force_update }}" != "true" ]; then
            echo "No storm data changes detected, skipping commit."
          else
            JTWC=$(python -c "import json; d=json.load(open('data/storms.json')); print(len(d.get('storms',[])))")
            ATL=$(python -c "import json; d=json.load(open('data/nhc_atlantic.json')); print(len(d.get('storms',[])))")
            PAC=$(python -c "import json; d=json.load(open('data/nhc_pacific.json')); print(len(d.get('storms',[])))")
            git commit -m "chore: update storm data — JTWC:${JTWC} ATL:${ATL} PAC:${PAC} [skip ci]"
            git push -u origin ${{ github.ref_name }}
            echo "Data committed and pushed successfully."
          fi
