name: Fetch JTWC Typhoon Data

on:
  # Triggered by cron-job.org via webhook (POST to the workflow_dispatch URL)
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if data unchanged'
        required: false
        default: 'false'
        type: boolean   # Recommended: makes the input a proper checkbox in the UI

  # Optional: Keep GitHub's built-in scheduler as a backup (or remove if you only want cron-job.org)
  # schedule:
  #   # Run every 3 hours (UTC)
  #   - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  fetch-jtwc-data:
    runs-on: ubuntu-latest
    name: Fetch and parse JTWC ATCF data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch JTWC data
        run: python scripts/fetch_jtwc.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit and push data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet && [ "${{ github.event.inputs.force_update }}" != "true" ]; then
            echo "No storm data changes detected, skipping commit."
          else
            STORM_COUNT=$(python -c "import json; d=json.load(open('data/storms.json')); print(len(d.get('storms', [])))")
            git commit -m "chore: update JTWC storm data — ${STORM_COUNT} active storm(s) [skip ci]"
            git push -u origin ${{ github.ref_name }}
            echo "Data committed and pushed successfully."
          fi
